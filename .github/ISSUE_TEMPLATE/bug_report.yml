name: Bug report
description: Report a reproducible Recny problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach recordings, transcripts, credentials, participant names, or private call content. Sanitize logs and screenshots before uploading them.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: recny-version
    attributes:
      label: Recny version
      placeholder: v0.1.8 or v0.2.5-beta
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system version
      placeholder: macOS 15.6 or Windows 11 24H2
    validations:
      required: true
  - type: input
    id: call-app
    attributes:
      label: Call app
      placeholder: Zoom, Google Meet in Chrome, Microsoft Teams
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Recny
        2. Join a call
        3. Wait for automatic recording
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste only the relevant lines after removing private paths and call details.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed recordings, transcripts, credentials, participant names, and private call content.
          required: true
