name: Windows Build

on:
  push:
    branches:
      - "codex/windows-mvp-scaffold"
      - "main"
      - "mvp/**"
  pull_request:
    paths:
      - "apps/windows/**"
      - ".github/workflows/windows-build.yml"
      - "docs/WINDOWS_CLIENT.md"
      - "docs/RELEASE_NOTES_WINDOWS_V0_2_4.md"
  workflow_dispatch:

jobs:
  build:
    name: Build Windows beta
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore apps/windows/ToRec.Windows/ToRec.Windows.csproj

      - name: Build
        run: dotnet build apps/windows/ToRec.Windows/ToRec.Windows.csproj -c Release --no-restore

      - name: Tests
        run: dotnet run --project apps/windows/ToRec.Windows.Tests/ToRec.Windows.Tests.csproj -c Release

      - name: Publish
        run: >
          dotnet publish apps/windows/ToRec.Windows/ToRec.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/windows/ToRec-Windows-v0.2.4-beta

      - name: Add release notes
        shell: pwsh
        run: Copy-Item docs/RELEASE_NOTES_WINDOWS_V0_2_4.md dist/windows/ToRec-Windows-v0.2.4-beta/README.md

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/windows/ToRec-Windows-v0.2.4-beta/* -DestinationPath dist/windows/ToRec-Windows-v0.2.4-beta.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToRec-Windows-v0.2.4-beta
          path: dist/windows/ToRec-Windows-v0.2.4-beta.zip
